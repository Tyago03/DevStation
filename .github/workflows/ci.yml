name: Windows CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: React UI tests
        run: npm run test:ui
      - name: Build unsigned Windows ZIP
        run: npm run make -- --arch=x64
      - name: Desktop and packaged application checks
        run: npm run test:e2e
      - name: Record artifact checksums
        run: |
          $archives = @(Get-ChildItem -LiteralPath out/make -Recurse -Filter *.zip)
          if ($archives.Count -eq 0) { throw 'No Windows ZIP was generated.' }
          New-Item -ItemType Directory -Path out/evidence -Force | Out-Null
          $archives | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -LiteralPath out/evidence/SHA256SUMS.txt -Encoding utf8
          @(
            "Commit: $env:GITHUB_SHA"
            "Built UTC: $([DateTime]::UtcNow.ToString('o'))"
            "OS: $([System.Environment]::OSVersion.VersionString)"
            "Node: $(node --version)"
            "npm: $(npm --version)"
            'Distribution: unsigned Windows x64 ZIP'
          ) | Set-Content -LiteralPath out/evidence/BUILD.txt -Encoding utf8
      - name: Upload private build evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devstation-windows-x64-${{ github.sha }}
          path: |
            out/make/**/*.zip
            out/evidence/*
          if-no-files-found: error
          retention-days: 14
